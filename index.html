<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big C Rain Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#111;font-size:13px}
#app{display:flex;flex-direction:column;height:100vh}
#tb{background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
.logo{font-size:14px;font-weight:700;color:#c62828}
.sub{font-size:10px;color:#888;margin-top:1px}
select,input[type=text],input[type=date]{font-size:12px;padding:4px 7px;border:1px solid #ccc;border-radius:4px;height:28px;background:#fff}
.btn{font-size:12px;padding:0 12px;border-radius:4px;cursor:pointer;border:none;height:28px;font-weight:700;white-space:nowrap}
.blue{background:#1565c0;color:#fff}.blue:hover{background:#0d47a1}
.blue:disabled{background:#9e9e9e;cursor:not-allowed}
.warn{background:#e65100;color:#fff}
.green{background:#2e7d32;color:#fff}.green:hover{background:#1b5e20}
.green:disabled{background:#9e9e9e;cursor:not-allowed}
#kpi{background:#fff;border-bottom:1px solid #ddd;padding:5px 12px;display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.kb{background:#f5f5f5;border:1px solid #e0e0e0;border-radius:4px;padding:4px 10px;text-align:center;min-width:80px}
.kv{font-size:15px;font-weight:700}.kl{font-size:10px;color:#666}
#main{display:flex;flex:1;overflow:hidden;min-height:0}
#map{flex:1;min-width:0}
#sb{width:300px;border-left:1px solid #ddd;background:#fff;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#sbh{padding:7px 10px;border-bottom:1px solid #eee;font-weight:700;color:#555;font-size:12px;flex-shrink:0}
#bl{flex:1;overflow-y:auto;min-height:0}
.bi{padding:7px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.bi:hover{background:#f0f8ff}
.bi.on{background:#e3f2fd;border-left:3px solid #1565c0}
.bn{font-size:12px;font-weight:700}.bm{font-size:11px;color:#888;margin-top:2px}.br{font-size:11px;margin-top:2px}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700}
.bfmt{background:#e3f2fd;color:#1565c0}
#det{border-top:1px solid #ddd;display:none;flex-shrink:0;background:#fafafa;font-size:12px}
#det.on{display:block}
#det-info{padding:10px}
.dt{font-size:13px;font-weight:700;margin-bottom:6px}
.dr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #eee;color:#666}
.dr:last-child{border:none}
.dr span:last-child{font-weight:700;color:#111}
/* Chart wrapper — fixed pixel height, never grows */
#chart-wrap{display:none;padding:8px 10px 10px;border-top:1px solid #eee;flex-shrink:0}
#chart-wrap h4{font-size:11px;color:#555;margin-bottom:5px;font-weight:700}
#chart-box{width:100%;height:140px;position:relative;overflow:hidden}
#chart-box canvas{display:block}
#prog{display:none;background:#e3f2fd;padding:4px 12px;border-bottom:1px solid #bbdefb;flex-shrink:0}
#pb{height:5px;background:#bbdefb;border-radius:3px;overflow:hidden}
#pf{height:100%;background:#1565c0;border-radius:3px;transition:width .1s}
#pl{font-size:11px;color:#1565c0;margin-top:2px}
.note{font-size:10px;color:#666;padding:5px 12px;background:#fff;border-bottom:1px solid #eee}
.flood{color:#b71c1c;font-weight:700}.near{color:#e65100;font-weight:700}
.forecast-row{display:flex;justify-content:space-between;gap:5px;padding:3px 0;border-bottom:1px solid #eee;font-size:11px}
#det{max-height:65vh;overflow-y:auto}
.leaflet-legend{background:rgba(255,255,255,.96);border:1px solid #ccc;border-radius:6px;padding:8px 10px;font-size:11px;line-height:1.9;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ll-t{font-weight:700;font-size:10px;color:#555;text-transform:uppercase;margin-bottom:3px;display:block}
.ll-r{display:flex;align-items:center;gap:6px;color:#333}
</style>
</head>
<body>
<div id="app">
<div id="tb">
  <div><div class="logo">&#9729; Big C Rain Monitor</div><div class="sub" id="sc">โหลด...</div></div>
  <select id="fmt" onchange="filt()">
    <option value="">ทุก Format</option>
    <option value="HYPERMARKET">Hypermarket</option>
    <option value="BIGCMINI">Big C Mini</option>
    <option value="PURE">Pure</option>
    <option value="MARKET">Market</option>
    <option value="FOOD PLACE">Food Place</option>
    <option value="BIGC_DEPOT">Depot</option>
  </select>
  <select id="reg" onchange="filt()">
    <option value="">ทุก Region</option>
    <option value="Bangkok and Perimeter">Bangkok &amp; Perimeter</option>
    <option value="East Region">East</option>
    <option value="Central Region">Central</option>
    <option value="Northeast Region">Northeast</option>
    <option value="South Region">South</option>
    <option value="North Region">North</option>
    <option value="West Region">West</option>
  </select>
  <input type="text" id="sq" placeholder="&#128269; ค้นหา..." oninput="filt()">
  <input type="date" id="dtin" onchange="onDtCh()">
  <button class="btn blue" onclick="document.getElementById('branchFile').click()">เลือก branches.json</button>
  <input type="file" id="branchFile" accept=".json,application/json" onchange="importBranches(this.files[0])" hidden>
  <button class="btn blue" id="lb" onclick="loadRain()">&#9729; ดูข้อมูลฝน</button>
  <button class="btn blue" onclick="document.getElementById('floodFile').click()">นำเข้าข้อมูลน้ำท่วม</button>
  <input type="file" id="floodFile" accept=".geojson,.json,application/geo+json,application/json" onchange="importFlood(this.files[0])" hidden>
  <select id="floodRadius" onchange="matchFlood()" title="ระยะห่างจากจุดรายงานน้ำท่วม"><option value="500">ใกล้ 500 ม.</option><option value="1000">ใกล้ 1 กม.</option><option value="2000">ใกล้ 2 กม.</option></select>
  <button class="btn green" id="expbtn" onclick="exportExcel()" disabled>&#128194; Export Excel</button>
</div>
<div class="note" id="floodNote">น้ำท่วม: ยังไม่ได้นำเข้า GeoJSON (จุดรายงานหรือขอบเขตพื้นที่น้ำท่วม) · ฝน 7 วันเป็นค่าคาดการณ์จาก Open-Meteo</div>
<div id="prog"><div id="pb"><div id="pf" style="width:0%"></div></div><div id="pl"></div></div>
<div id="kpi">
  <div class="kb"><div class="kv" id="kT">0</div><div class="kl">สาขา</div></div>
  <div class="kb"><div class="kv" id="kR" style="color:#1565c0">—</div><div class="kl">มีฝน</div></div>
  <div class="kb"><div class="kv" id="kH" style="color:#b71c1c">—</div><div class="kl">ฝนหนัก≥100mm</div></div>
  <div class="kb"><div class="kv" id="kM">—</div><div class="kl">สูงสุด(mm)</div></div>
  <div class="kb"><div class="kv" id="kA">—</div><div class="kl">เฉลี่ย(mm)</div></div>
  <div class="kb"><div class="kv" id="kF" style="color:#b71c1c">—</div><div class="kl">อยู่ในพื้นที่น้ำท่วม</div></div>
  <div class="kb"><div class="kv" id="kN" style="color:#e65100">—</div><div class="kl">จุดรายงานใกล้</div></div>
</div>
<div id="main">
  <div id="map"></div>
  <div id="sb">
    <div id="sbh">รายการสาขา</div>
    <div id="bl"></div>
    <div id="det">
      <div id="det-info"></div>
      <div id="forecast" style="padding:6px 10px;border-top:1px solid #eee"></div>
      <div id="chart-wrap">
        <h4 id="chart-title">&#127783; ฝนย้อนหลัง 15 วัน</h4>
        <div id="chart-box"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let BRANCHES = [];
let cache={}, histCache={}, curD='', fil=[], sel=null, rldd=false, map, lg;
let chartInst = null;
let floodFeatures=null, floodMatches={}, floodFileName='', floodLayer=null, forecastCache={}, selectToken=0;

function rainColor(mm) {
  if (mm===null||mm===undefined) return null;
  if (mm<=0)  return '#bdbdbd';
  if (mm<10)  return '#42a5f5';
  if (mm<25)  return '#1565c0';
  if (mm<40)  return '#2e7d32';
  if (mm<60)  return '#f9a825';
  if (mm<100) return '#e64a19';
  return '#b71c1c';
}
function rainLabel(mm) {
  if (mm===null||mm===undefined) return '—';
  if (mm<=0)  return 'ไม่มีฝน';
  if (mm<10)  return 'น้อย';
  if (mm<25)  return 'น้อย-ปานกลาง';
  if (mm<40)  return 'ปานกลาง';
  if (mm<60)  return 'ค่อนข้างมาก';
  if (mm<100) return 'มาก';
  return 'หนักมาก';
}

function makeIcon(b) {
  const mm  = cache[b.store_code];
  const col = (rldd&&mm!==undefined) ? (rainColor(mm)||'#bdbdbd') : '#bdbdbd';
  const fmt = b.format_short;
  const s   = fmt==='HYPERMARKET' ? 16 : 12;
  const h   = s/2;
  let inner = '';
  if (fmt==='HYPERMARKET') {
    inner=`<circle cx="${h}" cy="${h}" r="${h-1}" fill="${col}" stroke="white" stroke-width="1.3"/>`;
  } else if (fmt==='BIGCMINI') {
    inner=`<rect x="1" y="1" width="${s-2}" height="${s-2}" rx="1" fill="${col}" stroke="white" stroke-width="1.2"/>`;
  } else if (fmt==='PURE') {
    inner=`<polygon points="${h},1 ${s-1},${h} ${h},${s-1} 1,${h}" fill="${col}" stroke="white" stroke-width="1.2"/>`;
  } else if (fmt==='MARKET') {
    inner=`<polygon points="${h},1 ${s-1},${s-1} 1,${s-1}" fill="${col}" stroke="white" stroke-width="1.2"/>`;
  } else if (fmt==='FOOD PLACE') {
    const ro=h-1,ri=(h-1)*0.45,cx=h,cy=h; let pts='';
    for(let i=0;i<10;i++){const a=(i*36-90)*Math.PI/180,r=i%2===0?ro:ri;pts+=`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)} `;}
    inner=`<polygon points="${pts.trim()}" fill="${col}" stroke="white" stroke-width="1"/>`;
  } else {
    let pts='';
    for(let i=0;i<6;i++){const a=(i*60-90)*Math.PI/180;pts+=`${(h+(h-1)*Math.cos(a)).toFixed(1)},${(h+(h-1)*Math.sin(a)).toFixed(1)} `;}
    inner=`<polygon points="${pts.trim()}" fill="${col}" stroke="white" stroke-width="1.2"/>`;
  }
  const floodMark=floodMatches[b.store_code];
  if(floodMark) inner+=`<circle cx="${s-3}" cy="3" r="3" fill="${floodMark.type==='inside'?'#b71c1c':'#e65100'}" stroke="white" stroke-width="1"/>`;
  const svg=`<svg width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  return L.divIcon({html:svg,className:'',iconSize:[s,s],iconAnchor:[h,h],popupAnchor:[0,-(h+4)]});
}

function initMap() {
  map=L.map('map',{preferCanvas:false}).setView([13.0,101.5],6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:18
  }).addTo(map);
  lg=L.layerGroup().addTo(map);
  const leg=L.control({position:'bottomleft'});
  leg.onAdd=function(){
    const d=L.DomUtil.create('div','leaflet-legend');
    const dot=c=>`<svg width="11" height="11"><circle cx="5.5" cy="5.5" r="4.5" fill="${c}"/></svg>`;
    let h='<span class="ll-t">ปริมาณฝน</span>';
    [['#bdbdbd','ไม่มีฝน 0mm'],['#42a5f5','น้อย < 10mm'],['#1565c0','10–25mm'],
     ['#2e7d32','25–40mm'],['#f9a825','40–60mm'],['#e64a19','60–100mm'],['#b71c1c','≥100mm']
    ].forEach(([c,l])=>{h+=`<div class="ll-r">${dot(c)} ${l}</div>`;});
    h+='<hr style="margin:5px 0;border-color:#eee"><span class="ll-t">Shape / Format</span>';
    const sv=p=>`<svg width="11" height="11">${p}</svg>`;
    [[sv('<circle cx="5.5" cy="5.5" r="4.5" fill="#555"/>'),'Hypermarket'],
     [sv('<rect x="1" y="1" width="9" height="9" rx="1" fill="#555"/>'),'Big C Mini'],
     [sv('<polygon points="5.5,1 10,5.5 5.5,10 1,5.5" fill="#555"/>'),'Pure'],
     [sv('<polygon points="5.5,1 10,10 1,10" fill="#555"/>'),'Market'],
     [sv('<polygon points="5.5,1 6.5,4 10,4 7.2,6 8.2,9.5 5.5,7.5 2.8,9.5 3.8,6 1,4 4.5,4" fill="#555"/>'),'Food Place'],
     [sv('<polygon points="5.5,1 9.3,3.2 9.3,7.8 5.5,10 1.7,7.8 1.7,3.2" fill="#555"/>'),'Depot'],
    ].forEach(([s,l])=>{h+=`<div class="ll-r">${s} ${l}</div>`;});
    d.innerHTML=h; return d;
  };
  leg.addTo(map);
}

function draw() {
  lg.clearLayers();
  fil.forEach((b,i)=>{
    if(!b.lat||!b.lon)return;
    const mm=cache[b.store_code];
    const col=rldd&&mm!=null?rainColor(mm)||'#bdbdbd':'#9e9e9e';
    const mk=L.marker([b.lat,b.lon],{icon:makeIcon(b)});
    mk.bindPopup(
      '<b style="font-size:13px">'+b.store_name+'</b><br>'+
      '<span style="color:#666">'+b.format_short+' · '+b.region_short+'</span><br>'+
      'รหัส: '+b.store_code+'<br>'+
      '<b style="color:'+col+'">'+(rldd?mm!=null?mm.toFixed(1)+' mm — '+rainLabel(mm):'—':'กด ดูข้อมูลฝน')+'</b><br>'+
      (floodMatches[b.store_code]?.label||'น้ำท่วม: ยังไม่มีข้อมูลยืนยัน')
    );
    mk.on('click',()=>selB(i));
    mk.addTo(lg);
  });
  updateKPI(); renderList();
}

function updateKPI() {
  document.getElementById('kT').textContent=fil.length.toLocaleString();
  document.getElementById('kF').textContent=floodFeatures?fil.filter(b=>floodMatches[b.store_code]?.type==='inside').length:'—';
  document.getElementById('kN').textContent=floodFeatures?fil.filter(b=>floodMatches[b.store_code]?.type==='near').length:'—';
  if(!rldd){['kR','kH','kM','kA'].forEach(id=>document.getElementById(id).textContent='—');return;}
  let rn=0,hv=0,mx=0,sm=0,cn=0;
  fil.forEach(b=>{
    const mm=cache[b.store_code];if(mm==null)return;
    if(mm>0)rn++;if(mm>=100)hv++;if(mm>mx)mx=mm;sm+=mm;cn++;
  });
  document.getElementById('kR').textContent=rn;
  document.getElementById('kH').textContent=hv;
  document.getElementById('kM').textContent=cn?mx.toFixed(1)+' mm':'—';
  document.getElementById('kA').textContent=cn?(sm/cn).toFixed(1)+' mm':'—';
  document.getElementById('expbtn').disabled=false;
}

function renderList() {
  document.getElementById('sbh').textContent='รายการ ('+fil.length.toLocaleString()+')';
  document.getElementById('bl').innerHTML=fil.slice(0,300).map((b,i)=>{
    const mm=cache[b.store_code];
    const col=rldd&&mm!=null?rainColor(mm)||'#bdbdbd':'#9e9e9e';
    const rt=rldd?(mm!=null?`<span style="background:${col};color:#fff;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700">${mm.toFixed(1)} mm</span>`:'<span style="color:#aaa">—</span>'):'<span style="color:#aaa">—</span>';
    return `<div class="bi${b.store_code===sel?' on':''}" onclick="selB(${i})">
      <div class="bn">${b.store_name}</div>
      <div class="bm"><span class="badge bfmt">${b.format_short}</span> ${b.region_short}</div>
      <div class="br">${rt} <span class="${floodMatches[b.store_code]?.type==='inside'?'flood':'near'}">${floodMatches[b.store_code]?.label||''}</span></div></div>`;
  }).join('')+(fil.length>300?`<div style="padding:8px;color:#aaa;font-size:11px">...อีก ${(fil.length-300).toLocaleString()} สาขา</div>`:'');
}

// ── CHART: destroy then rebuild canvas from scratch ──────────────────────────
function destroyChart() {
  if (chartInst) {
    chartInst.destroy();
    chartInst = null;
  }
  // Wipe the box and create a fresh canvas — eliminates all stale state
  const box = document.getElementById('chart-box');
  box.innerHTML = '';
  const c = document.createElement('canvas');
  c.id = 'rainChart';
  c.style.display = 'block';
  box.appendChild(c);
}

async function selB(i) {
  const b=fil[i]; if(!b)return; sel=b.store_code; const token=++selectToken;
  const mm=cache[b.store_code];
  const dt=document.getElementById('dtin').value;
  map.setView([b.lat,b.lon],14);
  const col=rldd&&mm!=null?rainColor(mm)||'#bdbdbd':'#9e9e9e';
  document.getElementById('det-info').innerHTML=
    `<div class="dt" style="padding:10px 10px 4px">${b.store_name}</div>
    <div style="padding:0 10px 8px">
    <div class="dr"><span>รหัส</span><span>${b.store_code}</span></div>
    <div class="dr"><span>Format</span><span>${b.format_short}</span></div>
    <div class="dr"><span>Region</span><span>${b.region_short}</span></div>
    <div class="dr"><span>พิกัด</span><span>${b.lat.toFixed(4)}, ${b.lon.toFixed(4)}</span></div>
    <div class="dr"><span>ฝน (${dt})</span><span style="color:${col}">${rldd?mm!=null?mm.toFixed(1)+' mm — '+rainLabel(mm):'—':'ยังไม่โหลด'}</span></div>
    <div class="dr"><span>น้ำท่วม</span><span>${floodMatches[b.store_code]?.label||'ยังไม่มีข้อมูลยืนยัน'}</span></div>
    <div style="margin-top:8px"><button class="btn blue" style="width:100%" onclick="load1(${i})">&#9729; โหลดสาขานี้</button></div>
    </div>`;
  document.getElementById('det').className='on';

  // Reset chart area
  destroyChart();
  document.getElementById('chart-wrap').style.display='block';
  document.getElementById('chart-title').textContent='⏳ กำลังโหลดข้อมูลฝนย้อนหลัง...';
  renderList();
  document.getElementById('forecast').textContent='กำลังโหลดพยากรณ์ฝน 7 วัน...';
  loadForecast(b,token);
  await loadHistory(b, dt);
}

async function loadHistory(b, refDate) {
  const key = b.store_code+'_'+refDate;

  if (!histCache[key]) {
    const end   = new Date(refDate);
    const start = new Date(refDate); start.setDate(start.getDate()-14);
    const fmt   = d => d.toISOString().split('T')[0];
    const today = new Date(); today.setHours(0,0,0,0);
    const base  = end >= today
      ? 'https://api.open-meteo.com/v1/forecast'
      : 'https://archive-api.open-meteo.com/v1/archive';
    try {
      const url = base+'?latitude='+b.lat+'&longitude='+b.lon+
        '&daily=precipitation_sum&start_date='+fmt(start)+'&end_date='+fmt(end)+'&timezone=Asia%2FBangkok';
      const r = await fetch(url);
      const d = await r.json();
      histCache[key] = {
        dates:  d.daily.time,
        values: d.daily.precipitation_sum.map(v => v||0)
      };
    } catch(e) {
      document.getElementById('chart-title').textContent='⚠ โหลดกราฟไม่สำเร็จ';
      return;
    }
  }

  if(sel===b.store_code) renderChart(b, histCache[key]);
}

function renderChart(b, data) {
  document.getElementById('chart-title').textContent='🌧 ฝนย้อนหลัง 15 วัน — '+b.store_name;

  const labels = data.dates.map(d=>{
    const dt=new Date(d); return dt.getDate()+'/'+(dt.getMonth()+1);
  });
  const values = data.values;
  const colors = values.map(v=>
    v<=0?'#bdbdbd':v<10?'#42a5f5':v<25?'#1565c0':v<40?'#2e7d32':v<60?'#f9a825':v<100?'#e64a19':'#b71c1c'
  );

  // Get the fresh canvas created by destroyChart()
  const canvas = document.getElementById('rainChart');

  // Set explicit px dimensions before Chart.js sees it
  const boxW = document.getElementById('chart-box').clientWidth || 260;
  canvas.width  = boxW;
  canvas.height = 140;
  canvas.style.width  = boxW+'px';
  canvas.style.height = '140px';

  chartInst = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colors,
        borderRadius: 2,
        borderSkipped: 'bottom'
      }]
    },
    options: {
      responsive: false,       // fixed size — no resize observer loop
      animation:  false,       // no animation = no continuous redraws
      maintainAspectRatio: false,
      plugins: {
        legend: {display:false},
        tooltip: {
          callbacks: {
            label: ctx=>' '+ctx.raw.toFixed(1)+' mm — '+rainLabel(ctx.raw)
          }
        }
      },
      scales: {

// GeoJSON is supplied by the user; it is evidence of a report, not live flood verification.
function haversine(a,b){
 const rad=Math.PI/180, dLat=(b[1]-a[1])*rad, dLon=(b[0]-a[0])*rad;
 const h=Math.sin(dLat/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin(dLon/2)**2;
 return 12742000*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function segmentDistance(p,a,b){
 const scaleX=111320*Math.cos(p[1]*Math.PI/180), scaleY=111320;
 const ax=(a[0]-p[0])*scaleX, ay=(a[1]-p[1])*scaleY;
 const bx=(b[0]-p[0])*scaleX, by=(b[1]-p[1])*scaleY;
 const dx=bx-ax,dy=by-ay, t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/(dx*dx+dy*dy||1)));
 return Math.hypot(ax+t*dx,ay+t*dy);
}
function ringInside(p,ring){
 let inside=false;
 for(let i=0,j=ring.length-1;i<ring.length;j=i++){
  const a=ring[i], b=ring[j];
  if(((a[1]>p[1])!==(b[1]>p[1])) && p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]) inside=!inside;
 }
 return inside;
}
function polygonMatch(p,rings){
 const inside=ringInside(p,rings[0])&&!rings.slice(1).some(r=>ringInside(p,r));
 let distance=Infinity;
 for(const ring of rings) for(let i=0;i<ring.length;i++) distance=Math.min(distance,segmentDistance(p,ring[i],ring[(i+1)%ring.length]));
 return {inside,distance:inside?0:distance};
}
function geometryMatch(p,g){
 if(!g||!g.coordinates)return null;
 if(g.type==='Point')return {inside:false,distance:haversine(p,g.coordinates)};
 if(g.type==='MultiPoint')return {inside:false,distance:Math.min(...g.coordinates.map(q=>haversine(p,q)))};
 if(g.type==='Polygon')return polygonMatch(p,g.coordinates);
 if(g.type==='MultiPolygon'){
  const m=g.coordinates.map(poly=>polygonMatch(p,poly));
  return {inside:m.some(x=>x.inside),distance:Math.min(...m.map(x=>x.distance))};
 }
 return null;
}
async function importFlood(file){
 if(!file)return;
 try{
  if(file.size>15*1024*1024)throw Error('ไฟล์เกิน 15 MB');
  const data=JSON.parse(await file.text());
  const features=data.type==='FeatureCollection'?data.features:data.type==='Feature'?[data]:data.type&&data.coordinates?[{type:'Feature',geometry:data,properties:{}}]:null;
  if(!Array.isArray(features)||!features.length)throw Error('ต้องเป็น GeoJSON FeatureCollection, Feature หรือ geometry');
  const valid=features.filter(f=>f.geometry&&['Point','MultiPoint','Polygon','MultiPolygon'].includes(f.geometry.type));
  if(!valid.length)throw Error('ไม่พบ Point หรือ Polygon ที่ใช้ได้');
  floodFeatures=valid; floodFileName=file.name; matchFlood();
 }catch(e){document.getElementById('floodNote').textContent='นำเข้าไม่สำเร็จ: '+e.message;}
 document.getElementById('floodFile').value='';
}
function matchFlood(){
 if(!floodFeatures)return;
 const radius=Number(document.getElementById('floodRadius').value), matches={};
 for(const b of BRANCHES){
  const p=[b.lon,b.lat];let best=null;
  for(const f of floodFeatures){
   const m=geometryMatch(p,f.geometry); if(!m||!Number.isFinite(m.distance))continue;
   const type=m.inside?'inside':'near';
   if(m.distance>radius&&!m.inside)continue;
   if(!best||m.inside&&!best.inside||m.inside===best.inside&&m.distance<best.distance)
    best={inside:m.inside,type,distance:Math.round(m.distance),shape:f.geometry.type};
  }
  if(best)matches[b.store_code]={...best,label:best.inside?'อยู่ในขอบเขตน้ำท่วม':`รายงานน้ำท่วมใกล้ ${best.distance.toLocaleString()} ม.`};
 }
 floodMatches=matches;
 document.getElementById('floodNote').textContent=`น้ำท่วม: ${floodFileName} · ${floodFeatures.length.toLocaleString()} จุด/พื้นที่ · เวลาของข้อมูลขึ้นกับไฟล์ต้นทาง · ไม่พบข้อมูล ≠ ยืนยันว่าไม่ท่วม`;
 if(floodLayer)map.removeLayer(floodLayer);
 floodLayer=L.geoJSON({type:'FeatureCollection',features:floodFeatures},{
  style:{color:'#b71c1c',weight:2,fillColor:'#ef9a9a',fillOpacity:.2},
  pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:'#b71c1c',fillOpacity:.7})
 }).addTo(map);
 draw();
 if(sel!=null){const i=fil.findIndex(b=>b.store_code===sel);if(i>=0)selB(i);}
}
async function loadForecast(b,token){
 const box=document.getElementById('forecast');
 try{
  let data=forecastCache[b.store_code];
  if(!data||Date.now()-data.loaded>60*60*1000){
   const ctrl=new AbortController(), timeout=setTimeout(()=>ctrl.abort(),15000);
   let d;
   try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(b.lat)+'&longitude='+encodeURIComponent(b.lon)+
     '&daily=precipitation_sum,precipitation_probability_max&forecast_days=7&timezone=Asia%2FBangkok';
    const r=await fetch(u,{signal:ctrl.signal});if(!r.ok)throw Error('HTTP '+r.status);
    d=await r.json();if(d.error||!d.daily?.time?.length)throw Error(d.reason||'ไม่มีข้อมูล');
   }finally{clearTimeout(timeout);}
   data={dates:d.daily.time, mm:d.daily.precipitation_sum,prob:d.daily.precipitation_probability_max,
    sum:d.daily.precipitation_sum.reduce((a,v)=>a+(Number(v)||0),0),loaded:Date.now()};
   forecastCache[b.store_code]=data;
  }
  if(token!==selectToken)return;
  const rows=data.dates.map((date,i)=>{
   const mm=data.mm[i],pr=data.prob?.[i];
   return `<div class="forecast-row"><span>${date.slice(8,10)}/${date.slice(5,7)}</span><span>${mm==null?'—':Number(mm).toFixed(1)+' mm'} · โอกาสฝน ${pr==null?'—':pr+'%'}</span></div>`;
  }).join('');
  box.innerHTML='<b>พยากรณ์ฝน 7 วัน · Open-Meteo</b><div style="color:#666;font-size:10px;margin:3px 0">รวม '+data.sum.toFixed(1)+' mm · คาดการณ์ ไม่ใช่ปริมาณฝนที่วัดจริง · โหลด '+new Date(data.loaded).toLocaleString('th-TH',{timeZone:'Asia/Bangkok'})+'</div>'+rows;
 }catch(e){if(token===selectToken)box.textContent='โหลดพยากรณ์ไม่สำเร็จ: '+e.message;}
}

async function importBranches(file){
 if(!file)return;
 try{await setBranches(JSON.parse(await file.text()));}
 catch(e){document.getElementById('sc').textContent='โหลดสาขาไม่สำเร็จ: '+e.message;}

async function setBranches(data){
 if(!Array.isArray(data)||!data.length||data.some(b=>!Number.isFinite(Number(b.lat))||!Number.isFinite(Number(b.lon))||!b.store_code||!b.store_name))
  throw Error('รูปแบบ branches.json ไม่ถูกต้อง');
 BRANCHES=data.map(b=>({...b,lat:Number(b.lat),lon:Number(b.lon)}));
 cache={};histCache={};forecastCache={};floodMatches={};rldd=false;sel=null;
 fil=[...BRANCHES];
 document.getElementById('fmt').value='';document.getElementById('reg').value='';document.getElementById('sq').value='';
 document.getElementById('det').className='';
 document.getElementById('sc').textContent=BRANCHES.length.toLocaleString()+' สาขา';
 if(floodFeatures)matchFlood();else draw();
}
async function autoLoadBranches(){
 try{
  const r=await fetch('./branches.json',{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  await setBranches(await r.json());
 }catch(e){
  document.getElementById('sc').textContent='เลือก branches.json เพื่อโหลดสาขา';
  document.getElementById('bl').innerHTML='<div style="padding:12px;color:#666">เปิดไฟล์แบบออฟไลน์: กดปุ่ม “เลือก branches.json” ด้านบน และเลือกไฟล์จากโฟลเดอร์เดียวกัน</div>';
 }
}
